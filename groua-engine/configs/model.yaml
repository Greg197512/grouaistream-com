# GrouAI Music Engine - Model Configuration

audio:
  sample_rate: 48000
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  f_min: 0
  f_max: 24000
  segment_seconds: 10.24   # ~1920 mel frames

text_encoder:
  model_name: "google/flan-t5-base"
  max_length: 128
  embedding_dim: 768
  freeze: true

autoencoder:
  type: "vqvae"
  latent_channels: 8
  downsample_factor: 4         # mel(80, T) -> latent(8, T/4)
  hidden_channels: [64, 128, 256]
  num_residual_blocks: 2
  codebook_size: 1024          # only for VQ variant
  commitment_cost: 0.25

diffusion:
  unet_base_channels: 128
  unet_channel_mults: [1, 2, 4, 4]
  attention_resolutions: [2, 4]
  num_heads: 8
  time_embedding_dim: 256
  dropout: 0.1
  num_timesteps: 1000
  beta_schedule: "cosine"      # "linear" | "cosine"
  prediction_type: "epsilon"   # "epsilon" | "v_prediction"
  classifier_free_guidance: 7.5

vocoder:
  type: "hifigan"
  upsample_rates: [8, 8, 2, 2]
  upsample_kernel_sizes: [16, 16, 4, 4]
  resblock_kernel_sizes: [3, 7, 11]
  resblock_dilation_sizes:
    - [1, 3, 5]
    - [1, 3, 5]
    - [1, 3, 5]

inference:
  default_duration: 30
  default_steps: 50
  default_guidance: 7.5
  scheduler: "ddim"            # "ddpm" | "ddim" | "dpm-solver"

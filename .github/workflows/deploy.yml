name: Deploy to Vercel

# Stronę hostuje Lovable (DNS wskazuje na Lovable, nie Vercel), więc ten deploy
# jest zbędny i padał przy każdym pushu, zasypując skrzynkę czerwonymi mailami.
# Wyłączony automat — zostaje tylko ręczne uruchomienie (workflow_dispatch),
# gdyby kiedyś trzeba było wrócić na Vercel.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: --prod

name: Deploy Supabase Edge Functions

# Zastępuje auto-deploy z Lovable: po każdym pushu do main, który zmienia
# funkcje edge, wdraża je na projekt aplikacji (bvstv) przez Supabase CLI.
# CLI czyta supabase/config.toml, więc ustawienia verify_jwt są zachowane.
#
# Wymagany sekret repo: SUPABASE_ACCESS_TOKEN
#   (Supabase → Account → Access Tokens → Generate). Dodaj w:
#   GitHub → repo → Settings → Secrets and variables → Actions → New repository secret.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy --project-ref bvstvawnigyczvofzhps

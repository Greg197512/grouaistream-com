# Co tydzień (i na żądanie) mierzy głośność utworów radia i wykrywa martwe/ciche pliki.
# Wynik trafia do public/radio-loudness.json — radio wyrównuje z niego głośność i pomija złe pliki.
name: Radio — głośność i zdrowie anteny

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      branch:
        description: "Gałąź, na którą zapisać wynik"
        required: true
        default: "main"

permissions:
  contents: write

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ffmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Pomiar
        run: node scripts/measure-loudness.mjs
      - name: Zapisz wynik
        env:
          BRANCH: ${{ inputs.branch || 'main' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/radio-loudness.json
          git commit -m "Radio: pomiar głośności i zdrowia anteny" || { echo "Bez zmian"; exit 0; }
          git push origin "HEAD:$BRANCH"

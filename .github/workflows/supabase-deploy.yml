# Wdrożenie funkcji serwerowych (edge functions) do własnego projektu Supabase — bez Lovable.
# Uruchamia się po zmianie w supabase/functions na main albo ręcznie (Actions → Run workflow).
# Wymaga sekretu repozytorium SUPABASE_ACCESS_TOKEN (Supabase → Account → Access Tokens).
# Klucze API funkcji trzymamy w sejfie Vault projektu (nazwy fn_*); workflow kopiuje je do
# sekretów funkcji, maskując wartości w logach.
name: Supabase — wdrożenie funkcji

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/supabase-deploy.yml"

concurrency: supabase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: sbmfliylgpqyteezrrtn
    steps:
      - name: Sprawdzenie tokenu
        id: guard
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::Brak sekretu SUPABASE_ACCESS_TOKEN — pomijam wdrożenie."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.ok == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.guard.outputs.ok == 'true'
        with:
          version: latest

      - name: Klucze z sejfu Vault → sekrety funkcji
        if: steps.guard.outputs.ok == 'true'
        run: |
          set -euo pipefail
          resp=$(curl -sS --fail -X POST "https://api.supabase.com/v1/projects/$PROJECT_REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d '{"query":"select substr(name, 4) as k, decrypted_secret as v from vault.decrypted_secrets where name like '"'"'fn\\_%'"'"' and name <> '"'"'fn_LOVABLE_API_KEY'"'"'"}')
          # Maskowanie każdej linii każdej wartości, zanim cokolwiek trafi do logu.
          echo "$resp" | jq -r '.[] | .v | split("\n")[] | select(length > 0) | "::add-mask::" + .'
          mapfile -d '' args < <(echo "$resp" | jq -j '.[] | "\(.k)=\(.v)\u0000"')
          if [ "${#args[@]}" -gt 0 ]; then
            supabase secrets set "${args[@]}" --project-ref "$PROJECT_REF" > /dev/null
          fi
          echo "Ustawiono sekretów: ${#args[@]}"

      - name: Wdrożenie funkcji
        if: steps.guard.outputs.ok == 'true'
        run: |
          set -uo pipefail
          failed=()
          for dir in supabase/functions/*/; do
            name=$(basename "$dir")
            case "$name" in _*|secret-export) continue ;; esac
            [ -f "$dir/index.ts" ] || continue
            if ! supabase functions deploy "$name" --project-ref "$PROJECT_REF" --use-api; then
              failed+=("$name")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "::error::Nie wdrożono: ${failed[*]}"
            exit 1
          fi

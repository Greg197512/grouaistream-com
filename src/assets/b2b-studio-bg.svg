<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#06121f"/>
      <stop offset="1" stop-color="#020810"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2b3a"/>
      <stop offset="1" stop-color="#04141d"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <g id="bld" stroke="#22d3ee" stroke-opacity="0.18" fill="#0a1e2b" fill-opacity="0.5">
      <rect x="0" y="0" width="60" height="220"/>
    </g>
  </defs>

  <!-- Base -->
  <rect width="1920" height="1080" fill="url(#sky)"/>

  <!-- Studio window with city skyline -->
  <g opacity="0.9">
    <rect x="120" y="120" width="1680" height="470" rx="10" fill="url(#win)" stroke="#22d3ee" stroke-opacity="0.25"/>
    <!-- window mullions -->
    <line x1="680" y1="120" x2="680" y2="590" stroke="#22d3ee" stroke-opacity="0.15"/>
    <line x1="1240" y1="120" x2="1240" y2="590" stroke="#22d3ee" stroke-opacity="0.15"/>
    <line x1="120" y1="360" x2="1800" y2="360" stroke="#22d3ee" stroke-opacity="0.08"/>
    <!-- skyline silhouette -->
    <g fill="#0a1e2b" fill-opacity="0.75" stroke="#22d3ee" stroke-opacity="0.16">
      <rect x="180" y="380" width="70" height="210"/>
      <rect x="270" y="320" width="90" height="270"/>
      <rect x="380" y="420" width="60" height="170"/>
      <rect x="460" y="300" width="110" height="290"/>
      <rect x="600" y="400" width="70" height="190"/>
      <rect x="720" y="340" width="95" height="250"/>
      <rect x="840" y="260" width="80" height="330"/>
      <rect x="940" y="410" width="70" height="180"/>
      <rect x="1040" y="330" width="100" height="260"/>
      <rect x="1170" y="380" width="75" height="210"/>
      <rect x="1270" y="290" width="110" height="300"/>
      <rect x="1410" y="420" width="65" height="170"/>
      <rect x="1500" y="330" width="95" height="260"/>
      <rect x="1620" y="380" width="80" height="210"/>
    </g>
    <!-- window lights -->
    <g fill="#22d3ee" fill-opacity="0.5">
      <rect x="300" y="360" width="10" height="14"/><rect x="330" y="400" width="10" height="14"/>
      <rect x="500" y="340" width="10" height="14"/><rect x="530" y="390" width="10" height="14"/>
      <rect x="870" y="300" width="10" height="14"/><rect x="890" y="350" width="10" height="14"/>
      <rect x="1080" y="370" width="10" height="14"/><rect x="1300" y="330" width="10" height="14"/>
      <rect x="1330" y="380" width="10" height="14"/><rect x="1540" y="370" width="10" height="14"/>
    </g>
  </g>

  <!-- ON AIR sign -->
  <g transform="translate(1560,180)">
    <rect x="0" y="0" width="200" height="64" rx="10" fill="#1a0a10" stroke="#fb7185" stroke-opacity="0.7"/>
    <text x="100" y="42" font-family="Arial, sans-serif" font-size="30" font-weight="700" letter-spacing="4" fill="#fb7185" fill-opacity="0.85" text-anchor="middle">ON AIR</text>
    <rect x="0" y="0" width="200" height="64" rx="10" fill="url(#glow)"/>
  </g>

  <!-- Desk surface -->
  <rect x="0" y="720" width="1920" height="360" fill="#050f18"/>
  <rect x="0" y="712" width="1920" height="14" fill="url(#cyan)" opacity="0.25"/>

  <!-- Mixing console (faders + knobs) -->
  <g transform="translate(150,760)" stroke="#22d3ee" stroke-opacity="0.4">
    <rect x="0" y="0" width="520" height="220" rx="14" fill="#081824" fill-opacity="0.8"/>
    <!-- knobs row -->
    <g fill="#0c2534">
      <circle cx="60" cy="50" r="20"/><circle cx="140" cy="50" r="20"/><circle cx="220" cy="50" r="20"/>
      <circle cx="300" cy="50" r="20"/><circle cx="380" cy="50" r="20"/><circle cx="460" cy="50" r="20"/>
    </g>
    <g stroke="#22d3ee" stroke-opacity="0.7" stroke-width="3">
      <line x1="60" y1="50" x2="60" y2="34"/><line x1="140" y1="50" x2="152" y2="38"/>
      <line x1="220" y1="50" x2="208" y2="38"/><line x1="300" y1="50" x2="300" y2="34"/>
      <line x1="380" y1="50" x2="392" y2="38"/><line x1="460" y1="50" x2="448" y2="40"/>
    </g>
    <!-- faders -->
    <g>
      <line x1="60" y1="110" x2="60" y2="200"/><line x1="140" y1="110" x2="140" y2="200"/>
      <line x1="220" y1="110" x2="220" y2="200"/><line x1="300" y1="110" x2="300" y2="200"/>
      <line x1="380" y1="110" x2="380" y2="200"/><line x1="460" y1="110" x2="460" y2="200"/>
    </g>
    <g fill="url(#cyan)" opacity="0.8">
      <rect x="50" y="150" width="20" height="12" rx="3"/><rect x="130" y="130" width="20" height="12" rx="3"/>
      <rect x="210" y="165" width="20" height="12" rx="3"/><rect x="290" y="140" width="20" height="12" rx="3"/>
      <rect x="370" y="120" width="20" height="12" rx="3"/><rect x="450" y="158" width="20" height="12" rx="3"/>
    </g>
  </g>

  <!-- Broadcast microphone on boom arm -->
  <g transform="translate(1180,470)" stroke="#22d3ee" stroke-opacity="0.55" fill="none">
    <!-- boom arm -->
    <polyline points="360,290 250,150 120,120 40,60" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="250" cy="150" r="10" fill="#0c2534"/>
    <circle cx="120" cy="120" r="10" fill="#0c2534"/>
    <!-- mic body -->
    <g transform="translate(20,10) rotate(-28)">
      <rect x="-34" y="-70" width="68" height="120" rx="30" fill="#08202e" fill-opacity="0.9" stroke="#22d3ee" stroke-opacity="0.6"/>
      <line x1="-20" y1="-52" x2="-20" y2="34"/><line x1="0" y1="-58" x2="0" y2="40"/><line x1="20" y1="-52" x2="20" y2="34"/>
      <line x1="-30" y1="-30" x2="30" y2="-30"/><line x1="-30" y1="0" x2="30" y2="0"/><line x1="-30" y1="30" x2="30" y2="30"/>
    </g>
  </g>

  <!-- Headphones -->
  <g transform="translate(760,600)" stroke="#22d3ee" stroke-opacity="0.45" fill="none" stroke-width="5">
    <path d="M0 70 A70 70 0 0 1 140 70"/>
    <rect x="-14" y="66" width="34" height="70" rx="12" fill="#08202e" fill-opacity="0.85"/>
    <rect x="120" y="66" width="34" height="70" rx="12" fill="#08202e" fill-opacity="0.85"/>
  </g>

  <!-- Monitor screen with waveform -->
  <g transform="translate(1420,700)" stroke="#22d3ee" stroke-opacity="0.4">
    <rect x="0" y="0" width="360" height="200" rx="10" fill="#04121b" fill-opacity="0.9"/>
    <polyline points="20,100 50,60 80,130 110,40 140,120 170,70 200,150 230,50 260,110 290,80 320,140 340,100"
      fill="none" stroke="url(#cyan)" stroke-opacity="0.8" stroke-width="3"/>
    <line x1="180" y1="200" x2="180" y2="240" stroke-width="8"/>
    <rect x="120" y="240" width="120" height="10" rx="5" fill="#0c2534"/>
  </g>

  <!-- Sound wave accent bars (radio) -->
  <g transform="translate(900,470)" fill="url(#cyan)" opacity="0.5">
    <rect x="0" y="-10" width="8" height="20" rx="4"/>
    <rect x="18" y="-26" width="8" height="52" rx="4"/>
    <rect x="36" y="-40" width="8" height="80" rx="4"/>
    <rect x="54" y="-20" width="8" height="40" rx="4"/>
    <rect x="72" y="-34" width="8" height="68" rx="4"/>
    <rect x="90" y="-12" width="8" height="24" rx="4"/>
  </g>

  <!-- soft ambient glows -->
  <circle cx="1650" cy="220" r="260" fill="url(#glow)"/>
  <circle cx="400" cy="820" r="240" fill="url(#glow)" opacity="0.6"/>
</svg>

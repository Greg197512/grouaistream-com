<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="GrouAI Stream">
  <defs>
    <linearGradient id="gaBrand" x1="80" y1="120" x2="432" y2="392" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff2d9b"/>
      <stop offset="0.52" stop-color="#9b5cff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="gaBar" x1="256" y1="150" x2="256" y2="362" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff5cb8"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
    <filter id="gaGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="gaClip"><circle cx="256" cy="256" r="180"/></clipPath>
    <style>
      .gaBar { transform-box: fill-box; transform-origin: 50% 100%; }
      @media (prefers-reduced-motion: no-preference) {
        .gaBar { animation: gaEq 1s ease-in-out infinite; }
        .b1 { animation-duration: .86s; animation-delay: -.10s; }
        .b2 { animation-duration: 1.14s; animation-delay: -.45s; }
        .b3 { animation-duration: .72s;  animation-delay: -.20s; }
        .b4 { animation-duration: 1.02s; animation-delay: -.60s; }
        .b5 { animation-duration: .92s;  animation-delay: -.32s; }
      }
      @keyframes gaEq { 0%,100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    </style>
  </defs>

  <!-- Okragly neonowy pierscien -->
  <circle cx="256" cy="256" r="196" stroke="url(#gaBrand)" stroke-width="16" filter="url(#gaGlow)"/>

  <!-- Equalizer w srodku (wspolna linia bazowa y=362) — tanczy w okregu -->
  <g filter="url(#gaGlow)" clip-path="url(#gaClip)">
    <rect class="gaBar b1" x="150" y="272" width="26" height="90"  rx="13" fill="url(#gaBar)"/>
    <rect class="gaBar b2" x="196" y="212" width="26" height="150" rx="13" fill="url(#gaBar)"/>
    <rect class="gaBar b3" x="242" y="150" width="28" height="212" rx="14" fill="url(#gaBar)"/>
    <rect class="gaBar b4" x="290" y="212" width="26" height="150" rx="13" fill="url(#gaBar)"/>
    <rect class="gaBar b5" x="336" y="272" width="26" height="90"  rx="13" fill="url(#gaBar)"/>
  </g>

  <!-- Iskra AI -->
  <circle cx="398" cy="150" r="15" fill="#22d3ee" filter="url(#gaGlow)"/>
  <circle cx="398" cy="150" r="6"  fill="#eafcff"/>
</svg>

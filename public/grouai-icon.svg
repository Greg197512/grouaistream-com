<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GrouAI">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0" stop-color="#2c1c52"/>
      <stop offset="55%" stop-color="#160d2b"/>
      <stop offset="100%" stop-color="#07050e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF6D0"/>
      <stop offset="34%" stop-color="#F6D97E"/>
      <stop offset="70%" stop-color="#DBAB3D"/>
      <stop offset="100%" stop-color="#A9781F"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F6D97E"/>
      <stop offset="50%" stop-color="#7d5f1c"/>
      <stop offset="100%" stop-color="#F6D97E"/>
    </linearGradient>
    <filter id="glow" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="196" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.5"/>

  <g filter="url(#glow)">
    <rect x="161" y="216" width="26" height="80"  rx="13" fill="url(#gold)"/>
    <rect x="202" y="181" width="26" height="150" rx="13" fill="url(#gold)"/>
    <rect x="243" y="151" width="26" height="210" rx="13" fill="url(#gold)"/>
    <rect x="284" y="181" width="26" height="150" rx="13" fill="url(#gold)"/>
    <rect x="325" y="216" width="26" height="80"  rx="13" fill="url(#gold)"/>
  </g>
</svg>
